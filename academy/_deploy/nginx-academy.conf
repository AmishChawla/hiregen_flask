# Serve the academy as static files, ahead of the app's catch-all.
# This block must appear BEFORE `location / { proxy_pass ... }`.

location /academy/ {
    alias /var/www/hiregen/academy/;   # <- change to your real path
    index index.html;
    try_files $uri $uri/ /academy/404.html;
    error_page 404 /academy/404.html;

    # long cache for immutable assets, short for pages
    location ~* ^/academy/assets/.*\.(css|png|svg|jpg)$ {
        alias /var/www/hiregen/academy/assets/;
        expires 30d;
        add_header Cache-Control "public";
    }
}

# the dataset is large; let it stream and cache
location = /academy/dataset/ai-recruitment-dataset.zip {
    alias /var/www/hiregen/academy/dataset/ai-recruitment-dataset.zip;
    expires 30d;
    add_header Content-Disposition 'attachment; filename="ai-recruitment-dataset.zip"';
}
